name: quero-vagas-crawler

networks:
  default:
    name: powerful_tomitaka_default
    ipam: {}
    external: false

services:
  lightpanda:
    container_name: quero-vagas-crawler-browser
    image: lightpanda/browser:nightly
    restart: unless-stopped
    ports:
      - mode: ingress
        target: 9222
        published: "9222"
        protocol: tcp
    networks:
      - default
    labels:
      icon: https://raw.githubusercontent.com/ApenasGabs/JobsFinder/main/public/vite.svg

  quero-vagas-crawler:
    container_name: quero-vagas-crawler
    image: node:22-alpine
    restart: unless-stopped
    ports:
      - mode: ingress
        target: 3001
        published: "3001"
        protocol: tcp
    networks:
      - default
    depends_on:
      lightpanda:
        condition: service_started
        required: true
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - CRON_SCHEDULE=*/30 * * * *
      - LIGHTPANDA_HTTP=http://lightpanda:9222
      - LIGHTPANDA_WS=ws://lightpanda:9222
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - type: bind
        source: /DATA/AppData/quero-vagas-crawler
        target: /app
        bind:
          create_host_path: true
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache git
        cd /app
        if [ ! -d "/app/.git" ]; then
          echo "📥 Repositório não encontrado. Clonando $2 (branch $1)..."
          git clone --depth 1 -b "$1" "$2" /tmp/repo
          cp -a /tmp/repo/. /app/
          rm -rf /tmp/repo
          echo "✅ Repositório clonado com sucesso!"
        else
          echo "🔄 Repositório existente em /app. Verificando atualizações..."
          git pull origin "$1" || true
        fi
        mkdir -p /app/data /app/config /app/auth_baileys
        if [ ! -f /app/config/search.config.json ] && [ -f /app/config/search.config.example.json ]; then
          cp /app/config/search.config.example.json /app/config/search.config.json
        fi
        if [ ! -d /app/node_modules ]; then
          echo "📦 Instalando dependências..."
          yarn install --frozen-lockfile || yarn install
        fi
        if [ ! -d /app/dist ]; then
          echo "🏗️ Compilando frontend..."
          yarn build
        fi
        echo "🚀 Iniciando QueroVagas Crawler..."
        npx tsx server/index.ts
      - --
      - "main"
      - "https://github.com/ApenasGabs/JobsFinder.git"
    labels:
      icon: https://raw.githubusercontent.com/ApenasGabs/JobsFinder/main/public/vite.svg

x-casaos:
  architectures:
    - amd64
    - arm64
  author: Gabs
  developer: Gabs
  hostname: gabisa.local
  icon: https://raw.githubusercontent.com/ApenasGabs/JobsFinder/main/public/vite.svg
  index: /
  is_uncontrolled: false
  main: quero-vagas-crawler
  port_map: "3001"
  scheme: http
  tag: Utilities
  description:
    en_us: High-performance job crawler for 134+ companies with Baileys WhatsApp bot.
    pt_br: Agregador e crawler de vagas com robô de WhatsApp para grupos e baixo consumo.
  title:
    custom: QueroVagas Crawler
    en_us: QueroVagas Crawler
    pt_br: QueroVagas Crawler
